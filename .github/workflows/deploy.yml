name: Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u ${{ secrets.SFTP_USER }},${{ secrets.SFTP_PASSWORD }} ${{ secrets.SFTP_HOST }};
            mirror --reverse --delete --verbose \
              --exclude .git/ \
              --exclude .github/ \
              ./ /superfinishrenovations.com/public_html/;
            quit
          "
